###########################
#  Configuration
###########################

# bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
# bind -n WheelDownPane select-pane -t= \; send-keys -M

set-option -g mouse on

# use 256 term for pretty colors
set -g default-terminal "tmux-256color"

# enable Shift+Enter and other extended keys in Ghostty
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# increase scroll-back history
set -g history-limit 50000

# use vim key bindings
setw -g mode-keys vi

# decrease command delay (increases vim responsiveness)
set -sg escape-time 1

# enable utf8 characters
setw -q -g utf8 on

# increase repeat time for repeatable commands
set -g repeat-time 1000

# start window index at 1
set -g base-index 1

# start pane index at 1
setw -g pane-base-index 1

# highlight window when it has new activity
setw -g monitor-activity on
set -g visual-activity on

# name windows by directory, not agent process titles like node or 2.1.292
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g renumber-windows on

##########################
#  Key Bindings
###########################

# tmux prefix
unbind C-b
set -g prefix C-s

# move between Vim/tmux
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# paste
unbind C-p
bind C-p paste-buffer

# create new windows in same directory
unbind c
bind c new-window -c "#{pane_current_path}"

# create new splits in same directory
unbind %
bind | split-window -h -c "#{pane_current_path}"

# quickly switch panes
unbind ^J
bind ^J select-pane -t :.+

# start with blank name when renaming windows
unbind ,
bind-key , command-prompt -p (rename-window) "rename-window '%%'"

# jump to agents waiting for input or finished, across sessions
bind a display-popup -E -T 'Agents needing you' -w 75% -h 50% "$HOME/.local/bin/tmux-agent-picker"
# return to the last session; Ctrl-J remains available to cycle panes
bind o switch-client -l
bind C-o rotate-window

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# don't suspend-client
unbind-key C-z

# review uncommitted changes in an nvim popup over the current window (e.g. after a Claude Code task)
# runs in a nested "_crev_<session>" session so prefix-V can promote it to a real window;
# scripted so nesting/promotion logic stays out of tmux quoting hell
bind v run-shell "$HOME/.local/bin/crev-popup '#{session_name}' '#{pane_current_path}' '#{client_name}'"

# promote the crev popup to a real window in the session it was launched from
# (moving the popup session's only window destroys that session, which closes the popup)
bind V run-shell "$HOME/.local/bin/crev-promote '#{session_name}'"

###########################
# Status Bar
###########################

# set refresh interval for status bar
set -g status-interval 30

# center the status bar
set -g status-justify left

# show session, window, pane in left status bar
set -g status-left-length 40
set -g status-left '#I:#P #[default]'

# show agents, then the shell's foreground command; use the directory at a prompt
set -gw window-status-format '#I:#{?#{P:#{@agent_name}},#{s/ $//:#{P:#{?@agent_name,#{@agent_name}#{@agent_state} ,}}},#{?@pane_command,#{@pane_command},#{?#{m/r:^(zsh|bash|fish|sh|nu)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}}}'
set -gw window-status-current-format '#I:#{?#{P:#{@agent_name}},#{s/ $//:#{P:#{?@agent_name,#{@agent_name}#{@agent_state} ,}}},#{?@pane_command,#{@pane_command},#{?#{m/r:^(zsh|bash|fish|sh|nu)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}}}'
set-hook -g after-select-window "if -F '#{==:#{@agent_state},✓}' 'set -pu @agent_state'"
set-hook -g after-select-pane "if -F '#{==:#{@agent_state},✓}' 'set -pu @agent_state'"

# show session, date, and time in the right status bar
set-option -g status-right '[#{session_name}] %m/%d/%y %I:%M'

###########################
# Colors
###########################

# color status bar
set -g status-bg colour235
set -g status-fg white

# highlight current window
set-window-option -g window-status-current-style "bg=colour2, fg=black"

# set color of active pane
set-window-option -g pane-border-style "bg=black, fg=colour235"
set-window-option -g pane-active-border-style "bg=black, fg=green"
